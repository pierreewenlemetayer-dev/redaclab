<!DOCTYPE html>
<html>
<head>
<title>Redac Lab</title>

<style>
body {font-family: Arial; background:#f4f6f8; padding:20px;}
.layout {display:flex; gap:20px; align-items:flex-start;}
.sidebar {width:250px;}
.main {flex:1;}
.top-row {display:flex; gap:20px;}
.card {background:white; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:20px;}
textarea {width:100%; min-height:320px; font-family: Verdana; font-size:16px;}
.rep {background:#ffe066;}
.verbe {background:#74c0fc;}
#texteColorie {min-height:300px; border:1px solid #ccc; padding:10px; background:#fafafa;}
footer {text-align:center; margin-top:30px; color:#666;}
</style>
</head>

<body>

<h1>📝 Redac Lab</h1>

<div class="layout">

<div class="sidebar">

<div class="card">
<h2>👤 Élève</h2>
<p>Nom : <input id="nom"></p>
<button onclick="sauvegarder()">💾 Sauvegarder</button>
<button onclick="charger()">📂 Charger</button>
</div>

<div class="card">
<h2>🎯 Objectifs</h2>
<p>Mots min : <input id="objMots" type="number" value="300"></p>
</div>

</div>

<div class="main">

<div class="top-row">

<div class="card" style="flex:2">
<textarea id="texte" oninput="analyser()"></textarea>
</div>

<div class="card" style="flex:1">
<p>Mots : <span id="mots">0</span></p>
</div>

</div>

<div class="card">
<h2>Texte analysé</h2>
<div id="texteColorie"></div>
</div>

</div>

</div>

<footer>© Redac Lab – Pierre Lemétayer – 2026</footer>

<script>

function analyser(){
let t=document.getElementById("texte").value;
let mots=t.trim().split(/\s+/).filter(m=>m);
document.getElementById("mots").textContent=mots.length;
document.getElementById("texteColorie").innerText=t;
}

function sauvegarder(){
let nom=document.getElementById("nom").value;
let texte=document.getElementById("texte").value;

if(nom===""){alert("Entre ton nom"); return;}

localStorage.setItem("redac_"+nom, texte);
alert("Texte sauvegardé !");
}

function charger(){
let nom=document.getElementById("nom").value;

let texte=localStorage.getItem("redac_"+nom);

if(texte){
document.getElementById("texte").value=texte;
analyser();
}else{
alert("Aucun texte trouvé");
}
}

</script>

</body>
</html>
