<!DOCTYPE html>
<html>
<head>
<title>Redac Lab</title>

<style>
body {font-family: Arial; background:#f4f6f8; padding:20px;}
.layout {display:flex; gap:20px;}
.sidebar {width:250px;}
.main {flex:1;}
.top-row {display:flex; gap:20px;}
.card {background:white; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:20px;}

.text-block {flex:2; display:flex; flex-direction:column;}
.stats-block {flex:1;}

textarea {
width:100%;
min-height:320px;
font-family: Verdana;
font-size:16px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.ligne-eleve, .ligne-texte {
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
margin-bottom:10px;
}

input {padding:5px;}

button {
padding:5px 10px;
border:none;
border-radius:6px;
background:#1971c2;
color:white;
cursor:pointer;
}

button:hover {background:#125a9c;}

#texteColorie {
border:1px solid #ccc;
padding:10px;
background:#fafafa;
min-height:300px;
white-space:pre-wrap;
}

footer {text-align:center; margin-top:30px; color:#666;}
</style>
</head>

<body>

<h1>📝 Redac Lab</h1>

<div class="layout">

<div class="sidebar">
<div class="card">
<h2>🎯 Objectifs</h2>
<p>Mots min : <input type="number" id="objMots" value="300"></p>
</div>
</div>

<div class="main">

<div class="top-row">

<div class="card text-block">

<!-- LIGNE ÉLÈVE -->
<div class="ligne-eleve">
👤 <input id="nom" placeholder="Nom">
</div>

<!-- LIGNE TITRE + DATE -->
<div class="ligne-texte">
📝 <input id="titre" placeholder="Titre">
📅 <span id="date"></span>
<button id="btnAction" onclick="actionTexte()">💾 Ajouter</button>
</div>

<textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

<div id="listeTextes"></div>

</div>

<div class="card stats-block">
<p>Mots : <span id="mots">0</span></p>
</div>

</div>

<div class="card">
<h2>Texte analysé</h2>
<div id="texteColorie"></div>
</div>

</div>

</div>

<footer>© Redac Lab – Pierre Lemétayer – 2026</footer>

<script>

let indexCourant = null;

const textarea = document.getElementById("texte");

function afficherDate(){
let d = new Date();
document.getElementById("date").textContent = d.toLocaleDateString();
}
afficherDate();

textarea.addEventListener("input", analyser);
document.getElementById("nom").addEventListener("input", afficherTextes);

function analyser(){
let texte = textarea.value;
let mots = texte.trim().split(/\s+/).filter(m=>m);
document.getElementById("mots").textContent = mots.length;
document.getElementById("texteColorie").innerText = texte;
}

function actionTexte(){
if(indexCourant === null){
ajouterTexte();
}else{
modifierTexte();
}
}

function ajouterTexte(){
let nom = document.getElementById("nom").value;
let texte = document.getElementById("texte").value;
let titre = document.getElementById("titre").value || "Sans titre";
let date = document.getElementById("date").textContent;

if(nom===""){ alert("Entre ton nom"); return; }

let cle = "redac_" + nom;
let anciens = JSON.parse(localStorage.getItem(cle)) || [];

anciens.push({titre, date, contenu:texte});

localStorage.setItem(cle, JSON.stringify(anciens));

resetForm();
afficherTextes();
alert("Texte ajouté !");
}

function modifierTexte(){
let nom = document.getElementById("nom").value;
let cle = "redac_" + nom;

let textes = JSON.parse(localStorage.getItem(cle)) || [];

textes[indexCourant] = {
titre: document.getElementById("titre").value,
date: document.getElementById("date").textContent,
contenu: document.getElementById("texte").value
};

localStorage.setItem(cle, JSON.stringify(textes));

resetForm();
afficherTextes();
alert("Texte modifié !");
}

function afficherTextes(){
let nom = document.getElementById("nom").value;
let cle = "redac_" + nom;

let textes = JSON.parse(localStorage.getItem(cle)) || [];

let html = "<h3>📚 Mes textes</h3>";

textes.forEach((t, i) => {
html += `<p><button onclick="chargerTexte(${i})">${t.titre} (${t.date})</button></p>`;
});

document.getElementById("listeTextes").innerHTML = html;
}

function chargerTexte(index){
let nom = document.getElementById("nom").value;
let cle = "redac_" + nom;

let textes = JSON.parse(localStorage.getItem(cle)) || [];
let t = textes[index];

document.getElementById("texte").value = t.contenu;
document.getElementById("titre").value = t.titre;

indexCourant = index;
document.getElementById("btnAction").textContent = "✏️ Modifier";

analyser();
}

function resetForm(){
indexCourant = null;
document.getElementById("texte").value = "";
document.getElementById("titre").value = "";
document.getElementById("btnAction").textContent = "💾 Ajouter";
afficherDate();
}

</script>

</body>
</html>
