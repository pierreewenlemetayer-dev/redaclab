<!DOCTYPE html>
<html>
<head>
    <title>Redac Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .sidebar {
            width: 250px;
        }

        .main {
            flex: 1;
        }

        .top-row {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .text-block {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .stats-block {
            flex: 1;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            min-height: 320px;
            padding: 10px;
            font-size: 16px;
            font-family: Verdana, sans-serif;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input {
            margin-left: 10px;
        }

        .ligne-eleve {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 5px 10px;
            border-radius: 6px;
            border: none;
            background-color: #1971c2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #125a9c;
        }

        .rep { background-color: #ffe066; }
        .verbe { background-color: #74c0fc; }

        #texteColorie {
            white-space: pre-wrap;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
            min-height: 300px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }
    </style>
</head>

<body>

<h1>📝 Redac Lab</h1>

<div class="layout">

    <div class="sidebar">

        <div class="card">
            <h2>🎯 Objectifs</h2>
            <p>Mots min : <input type="number" id="objMots" value="300"></p>
            <p>Densité (%) : <input type="number" id="objDensite" value="55"></p>
            <p>Moyenne max : <input type="number" id="objMoyenne" value="21"></p>
        </div>

    </div>

    <div class="main">

        <div class="top-row">

            <div class="card text-block">

                <!-- BARRE ÉLÈVE -->
                <div class="ligne-eleve">
                    👤 <input id="nom" placeholder="Nom">
                    <button onclick="ajouterTexte()">💾 Ajouter</button>
                </div>

                <textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

                <!-- LISTE DES TEXTES -->
                <div id="listeTextes"></div>

            </div>

            <div class="card stats-block">
                <h2>📊</h2>
                <p>Mots : <span id="mots">0</span></p>
            </div>

        </div>

        <div class="card">
            <h2>Texte analysé</h2>
            <div id="texteColorie"></div>
        </div>

    </div>

</div>

<footer>© Redac Lab – Pierre Lemétayer – 2026</footer>

<script>

const textarea = document.getElementById("texte");

textarea.addEventListener("input", analyser);
document.getElementById("nom").addEventListener("input", afficherTextes);

function analyser(){
    let texte = textarea.value;
    let mots = texte.trim().split(/\s+/).filter(m => m);

    document.getElementById("mots").textContent = mots.length;
    document.getElementById("texteColorie").innerText = texte;
}

function ajouterTexte(){
    let nom = document.getElementById("nom").value;
    let texte = document.getElementById("texte").value;

    if(nom===""){ alert("Entre ton nom"); return; }

    let cle = "redac_" + nom;
    let anciens = JSON.parse(localStorage.getItem(cle)) || [];

    anciens.push(texte);

    localStorage.setItem(cle, JSON.stringify(anciens));

    afficherTextes();
    alert("Texte ajouté !");
}

function afficherTextes(){
    let nom = document.getElementById("nom").value;
    let cle = "redac_" + nom;

    let textes = JSON.parse(localStorage.getItem(cle)) || [];

    let html = "<h3>📚 Mes textes</h3>";

    textes.forEach((t, i) => {
        html += `<p><button onclick="chargerTexte(${i})">Texte ${i+1}</button></p>`;
    });

    document.getElementById("listeTextes").innerHTML = html;
}

function chargerTexte(index){
    let nom = document.getElementById("nom").value;
    let cle = "redac_" + nom;

    let textes = JSON.parse(localStorage.getItem(cle)) || [];

    document.getElementById("texte").value = textes[index];
    analyser();
}

</script>

</body>
</html>
