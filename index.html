<!DOCTYPE html>
<html>
<head>
<title>Redac Lab</title>

<style>
body {font-family: Arial; background:#f4f6f8; padding:20px;}
.layout {display:flex; gap:20px;}
.sidebar {width:250px;}
.main {flex:1;}
.right {width:260px;}

.card {
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
margin-bottom:20px;
}

textarea {
width:100%;
min-height:320px;
font-family: Verdana;
font-size:16px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.ligne {
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

button {
padding:5px 10px;
border:none;
border-radius:6px;
background:#1971c2;
color:white;
cursor:pointer;
}

button:hover {background:#125a9c;}

#texteColorie {
border:1px solid #ccc;
padding:10px;
background:#fafafa;
min-height:300px;
white-space:pre-wrap;
}

.bas {
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
font-size:14px;
}

footer {text-align:center; margin-top:30px; color:#666;}
</style>
</head>

<body>

<h1>📝 Redac Lab</h1>

<div class="layout">

<!-- GAUCHE -->
<div class="sidebar">

<div class="card">
<h2>🎯 Objectifs</h2>
<p>Mots min : <input type="number" id="objMots" value="300"></p>
</div>

<div class="card">
<h2>🔗 Outils</h2>
<p><a href="https://www.synonymo.fr/" target="_blank">Synonymes</a></p>
<p><a href="https://www.scribens.fr/" target="_blank">Orthographe</a></p>
</div>

</div>

<!-- CENTRE -->
<div class="main">

<div class="card">

<!-- LIGNE ÉLÈVE -->
<div class="ligne">
👤 <input id="nom" placeholder="Nom">
</div>

<textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

</div>

<div class="card">
<h2>Texte analysé</h2>
<div id="texteColorie"></div>
</div>

<!-- BAS COMPACT -->
<div class="card bas">

<button onclick="ajouterTexte()">💾 Ajouter</button>
<button onclick="modifierTexte()">✏️ Modifier</button>

<span id="listeInline"></span>

<span id="progression"></span>

</div>

</div>

<!-- DROITE -->
<div class="right">

<div class="card">
<h2>📊 Statistiques</h2>
<p>Mots : <span id="mots">0</span></p>
</div>

</div>

</div>

<footer>© Redac Lab – Pierre Lemétayer – 2026</footer>

<script>

let indexCourant = null;

document.getElementById("texte").addEventListener("input", analyser);
document.getElementById("nom").addEventListener("input", afficherTout);

function analyser(){
let texte = document.getElementById("texte").value;
let mots = texte.trim().split(/\s+/).filter(m=>m);
document.getElementById("mots").textContent = mots.length;
document.getElementById("texteColorie").innerText = texte;
}

function ajouterTexte(){
let nom = document.getElementById("nom").value;
if(nom===""){ alert("Entre ton nom"); return; }

let data = chargerData(nom);

data.push({
contenu: document.getElementById("texte").value,
mots: compterMots()
});

sauverData(nom,data);

resetForm();
afficherTout();
alert("Texte ajouté !");
}

function modifierTexte(){
let nom = document.getElementById("nom").value;
if(indexCourant===null){ alert("Choisis un texte"); return; }

let data = chargerData(nom);

data[indexCourant] = {
contenu: document.getElementById("texte").value,
mots: compterMots()
};

sauverData(nom,data);

resetForm();
afficherTout();
alert("Texte modifié !");
}

function chargerTexte(i){
let nom = document.getElementById("nom").value;
let data = chargerData(nom);

document.getElementById("texte").value = data[i].contenu;

indexCourant = i;

analyser();
}

function chargerData(nom){
return JSON.parse(localStorage.getItem("redac_"+nom)) || [];
}

function sauverData(nom,data){
localStorage.setItem("redac_"+nom, JSON.stringify(data));
}

function compterMots(){
let texte = document.getElementById("texte").value;
return texte.trim().split(/\s+/).filter(m=>m).length;
}

function afficherTout(){
let nom = document.getElementById("nom").value;
let data = chargerData(nom);

let liste = "";
data.forEach((t,i)=>{
liste += `<button onclick="chargerTexte(${i})">${i+1}</button> `;
});
document.getElementById("listeInline").innerHTML = liste;

if(data.length>=2){
let debut = data[0].mots;
let fin = data[data.length-1].mots;
let diff = fin - debut;

document.getElementById("progression").innerHTML =
`📈 ${debut} → ${fin} (${diff>=0?"+":""}${diff})`;
}else{
document.getElementById("progression").innerHTML = "";
}
}

function resetForm(){
indexCourant = null;
document.getElementById("texte").value="";
}

</script>

</body>
</html>
