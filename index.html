<!DOCTYPE html>
<html>
<head>
<title>Redac Lab</title>

<style>
body {font-family: Arial; background:#f4f6f8; padding:20px;}
.layout {display:flex; gap:20px; align-items:flex-start;}
.sidebar {width:250px;}
.main {flex:1;}
.top-row {display:flex; gap:20px;}
.card {background:white; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:20px;}

textarea {
width:100%;
min-height:320px;
font-family: Verdana;
font-size:16px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.ligne {display:flex; gap:10px; align-items:center; margin-bottom:10px;}

.rep {background:#ffe066;}
.verbe {background:#74c0fc;}

#texteColorie {
white-space:pre-wrap;
border:1px solid #ccc;
padding:15px;
border-radius:8px;
background:#fafafa;
min-height:300px;
}

.bas {
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
font-size:14px;
}

footer {text-align:center; margin-top:30px; color:#666;}
</style>
</head>

<body>

<h1>📝 Redac Lab</h1>

<div class="layout">

<!-- GAUCHE -->
<div class="sidebar">

<div class="card">
<h2>🎯 Objectifs</h2>
<p>Mots min : <input id="objMots" type="number" value="300"></p>
<p>Densité (%) : <input id="objDensite" type="number" value="55"></p>
<p>Moyenne max : <input id="objMoyenne" type="number" value="21"></p>
</div>

<div class="card">
<h2>🔗 Outils</h2>
<p><a href="https://www.synonymo.fr/" target="_blank">Synonymes</a></p>
<p><a href="https://www.scribens.fr/" target="_blank">Orthographe</a></p>
</div>

</div>

<!-- CENTRE -->
<div class="main">

<div class="top-row">

<div class="card" style="flex:2">

<div class="ligne">
👤 <input id="nom" placeholder="Nom">
</div>

<textarea id="texte" placeholder="Écris ton texte ici..."></textarea>

</div>

<div class="card" style="flex:1">
<h2>📊 Statistiques</h2>
<p>Mots : <span id="mots">0</span></p>
<p>Phrases : <span id="phrases">0</span></p>
<p>Moyenne mots / phrase : <span id="moyenne">0</span></p>
<p>Densité lexicale : <span id="densite">0</span>%</p>
</div>

</div>

<div class="card">
<h2>🔍 Texte analysé</h2>
<div id="texteColorie"></div>
</div>

<!-- BAS -->
<div class="card bas">

<button onclick="ajouterTexte()">💾 Ajouter</button>
<button onclick="modifierTexte()">✏️ Modifier</button>

<span id="listeInline"></span>

<span id="progression"></span>

</div>

</div>

</div>

<footer>© Redac Lab – Pierre Lemétayer – 2026</footer>

<script>

let indexCourant = null;

const textarea = document.getElementById("texte");

textarea.addEventListener("input", analyser);
document.getElementById("nom").addEventListener("input", afficherTout);

function analyser(){
let texte = textarea.value.toLowerCase();

let mots = texte.trim().split(/\s+/).filter(m=>m);
let nbMots = mots.length;

let phrases = texte.split(/[.!?]+/).filter(p=>p.trim());
let nbPhrases = phrases.length;

let moyenne = nbPhrases ? nbMots/nbPhrases : 0;

let uniques = new Set(mots);
let densite = nbMots ? (uniques.size/nbMots)*100 : 0;

document.getElementById("mots").textContent = nbMots;
document.getElementById("phrases").textContent = nbPhrases;
document.getElementById("moyenne").textContent = moyenne.toFixed(1);
document.getElementById("densite").textContent = densite.toFixed(1);

document.getElementById("texteColorie").innerText = textarea.value;
}

function ajouterTexte(){
let nom = document.getElementById("nom").value;
if(nom===""){ alert("Entre ton nom"); return; }

let data = chargerData(nom);

data.push({
contenu: textarea.value,
mots: compterMots()
});

sauverData(nom,data);
resetForm();
afficherTout();
}

function modifierTexte(){
let nom = document.getElementById("nom").value;
if(indexCourant===null){ alert("Choisis un texte"); return; }

let data = chargerData(nom);

data[indexCourant] = {
contenu: textarea.value,
mots: compterMots()
};

sauverData(nom,data);
resetForm();
afficherTout();
}

function chargerTexte(i){
let nom = document.getElementById("nom").value;
let data = chargerData(nom);

textarea.value = data[i].contenu;
indexCourant = i;
analyser();
}

function chargerData(nom){
return JSON.parse(localStorage.getItem("redac_"+nom)) || [];
}

function sauverData(nom,data){
localStorage.setItem("redac_"+nom, JSON.stringify(data));
}

function compterMots(){
return textarea.value.trim().split(/\s+/).filter(m=>m).length;
}

function afficherTout(){
let nom = document.getElementById("nom").value;
let data = chargerData(nom);

let liste="";
data.forEach((t,i)=>{
liste+=`<button onclick="chargerTexte(${i})">${i+1}</button> `;
});
document.getElementById("listeInline").innerHTML=liste;

if(data.length>=2){
let debut=data[0].mots;
let fin=data[data.length-1].mots;
let diff=fin-debut;
document.getElementById("progression").innerHTML=
`📈 ${debut} → ${fin} (${diff>=0?"+":""}${diff})`;
}else{
document.getElementById("progression").innerHTML="";
}
}

function resetForm(){
indexCourant=null;
textarea.value="";
}

</script>

</body>
</html>
